<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · Machado</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="theme-boot.js?v=5"></script>
  <link rel="stylesheet" href="theme.css?v=5">
  <link rel="stylesheet" href="pages.css?v=5">
</head>
<body class="page-centered">

  <main class="panel" id="panel" hidden>
    <span class="wordmark" role="img" aria-label="Machado"></span>
    <p class="tagline">Just write.</p>

    <form id="auth-form" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" autocomplete="email" required
               autocapitalize="none" spellcheck="false">
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" id="password" autocomplete="current-password"
               required minlength="8">
      </label>

      <p class="notice" id="notice" hidden></p>

      <button type="submit" class="btn-primary" id="submit">Sign in</button>
    </form>

    <div class="divider"><span>or</span></div>

    <button type="button" class="btn-google" id="google">
      <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <p class="switch">
      <span id="switch-text">New here?</span>
      <button type="button" class="linkish" id="switch-mode">Create an account</button>
    </p>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="backend.js?v=5"></script>
  <script src="login.js?v=5"></script>
</body>
</html>
