<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Machado</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="booting">

  <header id="menubar" class="menubar" aria-label="Menu bar"></header>

  <div class="tabstrip" id="tabstrip">
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="tab-add" id="tab-add" title="New entry (⌘T)" aria-label="New entry">+</button>
  </div>

  <main class="editor" id="editor"></main>

  <!-- Find bar -->
  <div class="floatbar findbar" id="findbar" hidden>
    <input type="text" id="find-input" placeholder="Find" spellcheck="false" autocomplete="off">
    <span class="find-count" id="find-count"></span>
    <button class="bar-btn" id="find-prev" title="Previous (⇧↩)">‹</button>
    <button class="bar-btn" id="find-next" title="Next (↩)">›</button>
    <button class="bar-btn bar-close" id="find-close" title="Done (esc)">✕</button>
  </div>

  <!-- Go to line bar -->
  <div class="floatbar gotobar" id="gotobar" hidden>
    <label for="goto-input">Go to line</label>
    <input type="number" id="goto-input" min="1" spellcheck="false" autocomplete="off">
    <button class="bar-btn bar-close" id="goto-close" title="Done (esc)">✕</button>
  </div>

  <footer class="statusbar">
    <span id="status-pos">Ln 1</span>
    <span class="status-right">
      <span id="status-sync" hidden></span>
      <span id="status-zoom" hidden></span>
      <span id="status-words">0 words</span>
      <span id="status-count">0 characters</span>
    </span>
  </footer>

  <!-- Print target: filled with the active document at print time -->
  <div id="print-root" aria-hidden="true"></div>

  <script src="vendor/supabase.js"></script>
  <script src="backend.js"></script>
  <script src="app.js"></script>
</body>
</html>
